# Netlify deploys only the landing page in site/ — the rest of this repo is the marketing suite.
# The generated site/public/ is committed, so no build step runs on Netlify.
[build]
  base = "site"
  publish = "public"
  command = ""
  # Skip deploys when nothing under site/ changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Posting routines load the site graphics cross-origin (canvas -> file upload).
[[headers]]
  for = "/img/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The site moved to Hostinger (2026-10-17). Send every old URL, including pin destinations,
# to the same path on the new domain.
[[redirects]]
  from = "/*"
  to = "https://kitchenfindsfavorites.com/:splat"
  status = 301
  force = true
