name: Discover product candidates
on:
  schedule:
    - cron: "47 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/discover_products.py", "tests/test_discovery.py", ".github/workflows/discover-products.yml"]
permissions:
  contents: write
concurrency:
  group: product-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
      AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
      AMAZON_CREDENTIAL_VERSION: ${{ vars.AMAZON_CREDENTIAL_VERSION || '3.1' }}
      KFF_DISCOVERY_REPORT: marketing-queue/product-candidates.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test request contract and duplicate protection
        run: python -m unittest discover -s tests -p test_discovery.py
      - name: Verify Amazon configuration
        shell: bash
        run: |
          if [ -z "$AMAZON_CREATORS_CLIENT_ID" ] || [ -z "$AMAZON_CREATORS_CLIENT_SECRET" ]; then
            echo '::error::Configure AMAZON_CREATORS_CLIENT_ID and AMAZON_CREATORS_CLIENT_SECRET in repository Actions secrets. No candidates were imported.'
            exit 1
          fi
      - name: Discover up to five new ASINs
        run: python site/discover_products.py
      - name: Save candidate queue
        shell: bash
        run: |
          if [ ! -f "$KFF_DISCOVERY_REPORT" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$KFF_DISCOVERY_REPORT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Queue new Amazon ASINs for editorial verification'
          git push origin HEAD:main
      - name: Explain publishing boundary
        run: echo 'Candidate ASINs are queued for research. Only reviewed catalog and built site changes deploy through deploy-hostinger.yml. Discovery does not establish conversion performance, seller eligibility or editorial readiness.' >> "$GITHUB_STEP_SUMMARY"
