# Downloads a photo of a similar item for every product that has none (site/stock_photos.py), rebuilds the
# site so cards and pins show it, and commits the result to the branch it ran on.
# Uses Pixabay when the PIXABAY_API_KEY secret is set, otherwise public-domain photos from Wikimedia Commons (no key needed).
# Run it from Actions > "Fetch product photos" > Run workflow. On main, it opens a PR instead of pushing,
# because pushes made by this workflow don't start the deploy.
name: Fetch product photos
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch = automatic picks; candidates = shortlist photos for review (pushed to the photo-candidates branch); choose = download the photos listed in assets/products/chosen.json"
        type: choice
        options: [fetch, candidates, choose]
        default: fetch
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: fetch-photos-${{ github.ref }}
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos and rebuild
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        working-directory: site
        run: |
          set -euo pipefail
          pip install --quiet pillow
          case "${{ inputs.mode || 'fetch' }}" in
            candidates) python3 photo_candidates.py candidates ;;
            choose) python3 photo_candidates.py choose; python3 stock_photos.py --check; python3 build.py ;;
            *) python3 stock_photos.py --free; python3 stock_photos.py --check; python3 build.py ;;
          esac
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.mode }}" = "candidates" ]; then
            git checkout -q -B photo-candidates
            git add -f site/photo-candidates
            git commit -q -m "Photo candidates for review"
            git push -f origin photo-candidates
            exit 0
          fi
          git add site
          if [ ! -s site/assets/products/photos.json ] || [ "$(cat site/assets/products/photos.json)" = "{}" ]; then git reset -q -- site/assets/products/photos.json 2>/dev/null || true; fi
          if git diff --cached --quiet; then echo "No new photos"; exit 0; fi
          git commit -q -m "Add similar-item photos for products that had none"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            BRANCH="photos-$(date -u +%Y%m%d-%H%M)"
            git push origin "HEAD:refs/heads/$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Add similar-item photos ($(date -u +%Y-%m-%d))" \
              --body "Photos fetched by the Fetch product photos workflow. Merge to publish."
          else
            git push origin "HEAD:$BRANCH"
          fi
