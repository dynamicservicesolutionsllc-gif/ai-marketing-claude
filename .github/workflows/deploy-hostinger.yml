name: Deploy to Hostinger

on:
  push:
    branches:
      - amazon-ingestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy_key"
          chmod 600 "$HOME/.ssh/hostinger_deploy_key"
      - name: Verify Hostinger host key
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          test "$actual" = "$SSH_FINGERPRINT"
          chmod 644 "$HOME/.ssh/known_hosts"
      - name: Verify SSH access
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy_key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'printf "Hostinger SSH access verified\\n"'
      - name: Deploy website files
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --checksum --exclude '.git/' --exclude '.github/' --exclude '.env' --exclude '.env.*' --exclude 'data/products.json' --exclude 'data/*.lock' --exclude 'deploy/' -e "ssh -i $HOME/.ssh/hostinger_deploy_key -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
      - name: Install private sync wrapper and token
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SYNC_ENDPOINT_TOKEN: ${{ secrets.SYNC_ENDPOINT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$SYNC_ENDPOINT_TOKEN" | ssh -i "$HOME/.ssh/hostinger_deploy_key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'umask 077; mkdir -p "$HOME/private"; cat > "$HOME/private/sync-endpoint-token.txt"; chmod 600 "$HOME/private/sync-endpoint-token.txt"'
          scp -i "$HOME/.ssh/hostinger_deploy_key" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deploy/amazon-sync.sh "$SSH_USER@$SSH_HOST:\$HOME/private/amazon-sync.sh"
          ssh -i "$HOME/.ssh/hostinger_deploy_key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'chmod 700 "$HOME/private/amazon-sync.sh"'
      - name: Remove temporary key material
        if: always()
        run: rm -f "$HOME/.ssh/hostinger_deploy_key" "$HOME/.ssh/known_hosts"
