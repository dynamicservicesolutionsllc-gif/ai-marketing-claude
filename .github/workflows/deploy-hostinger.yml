name: Deploy to Hostinger

on:
  push:
    branches:
      - amazon-ingestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install SSH key and known host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy_key"
          chmod 600 "$HOME/.ssh/hostinger_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify SSH access
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" 'printf "Hostinger SSH access verified\\n"'

      - name: Deploy repository files
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --checksum \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'data/products.json' \
            --exclude 'data/*.lock' \
            -e "ssh -i $HOME/.ssh/hostinger_deploy_key -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Remove temporary key material
        if: always()
        run: |
          rm -f "$HOME/.ssh/hostinger_deploy_key" "$HOME/.ssh/known_hosts"
