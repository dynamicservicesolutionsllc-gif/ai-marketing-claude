# Publishes the built site (site/public/) to the `hostinger-deploy` branch, then tells Hostinger to pull it.
# The branch keeps a normal history (no force-push) so Hostinger's pull is always a fast-forward.
#
# Amazon product photos: once the repo has the AMAZON_CREATORS_CLIENT_ID / AMAZON_CREATORS_CLIENT_SECRET
# secrets (Creators API access needs 10+ qualifying sales in 30 days), every run fetches fresh official
# Amazon photos and rebuilds the site with them. The daily schedule keeps that data fresh, as Amazon's
# API terms require. Without the secrets, the committed site/public/ is published unchanged.
name: Deploy site to Hostinger
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-hostinger.yml"]
  schedule:
    - cron: "17 9 * * *"  # daily, ~5:17 AM ET
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
      AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Rebuild with official Amazon photos (only when API keys are set)
        if: env.AMAZON_CREATORS_CLIENT_ID != '' && env.AMAZON_CREATORS_CLIENT_SECRET != ''
        working-directory: src/site
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 fetch_amazon_images.py
          python3 build.py
      - name: Push site/public to hostinger-deploy
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          SRC_SHA="$(git -C src rev-parse --short HEAD)"
          if git ls-remote --exit-code --heads "$REPO" hostinger-deploy >/dev/null; then
            git clone -q --depth 1 --branch hostinger-deploy "$REPO" deploy
          else
            git init -q -b hostinger-deploy deploy
            git -C deploy remote add origin "$REPO"
          fi
          rsync -a --delete --exclude .git src/site/public/ deploy/
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No site changes"; exit 0; fi
          git commit -q -m "Deploy site from main@${SRC_SHA}"
          git push origin hostinger-deploy
      - name: Tell Hostinger to pull the new build
        # Hostinger's Git auto-deployment webhook (hPanel > Advanced > GIT > Auto Deployment).
        # Calling it only makes Hostinger pull the hostinger-deploy branch, so it is safe to keep here.
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/hostinger-deploy","repository":{"clone_url":"https://github.com/${{ github.repository }}.git"}}' \
            https://webhooks.hostinger.com/deploy/ebbd9dab3b992ae00646deb3cb90f821
      - name: Tell search engines about the pages (IndexNow)
        # Bing, Yandex and other IndexNow engines recrawl the submitted URLs within hours instead of weeks.
        # The key file /<INDEXNOW_KEY>.txt is written by build.py. A failure here never blocks the deploy.
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 90  # give Hostinger time to pull the new build so the key file and new pages are live
          python3 - <<'EOF'
          import json, re, urllib.request
          site = "src/site"
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', open(f"{site}/build.py").read()).group(1)
          urls = re.findall(r"<loc>([^<]+)</loc>", open(f"{site}/public/sitemap.xml").read())
          body = json.dumps({"host": "kitchenfindsfavorites.com", "key": key,
                             "keyLocation": f"https://kitchenfindsfavorites.com/{key}.txt", "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, "for", len(urls), "URLs")
          EOF
