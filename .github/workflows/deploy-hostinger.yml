# Publishes the built site (site/public/) to the `hostinger-deploy` branch, then tells Hostinger to pull it.
# The branch keeps a normal history (no force-push) so Hostinger's pull is always a fast-forward.
#
# SiteStripe imports use reviewed long links and reviewed product photos and original editorial graphics.
# Builds run without Amazon API access or network product discovery.
name: Deploy site to Hostinger
on:
  push:
    branches: [main]
    paths: ["site/**", "tests/test_sitestripe.py", ".github/workflows/deploy-hostinger.yml"]
  schedule:
    - cron: "17 * * * *"  # hourly automated checks, builds, and approved fixes
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Install build dependencies
        run: pip install --quiet pillow
      - name: Test photo, import and campaign requirements
        working-directory: src
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Import approved SiteStripe products
        working-directory: src/site
        run: python3 import_sitestripe.py imports/sitestripe.json --apply
      - name: Build without Amazon API access
        working-directory: src/site
        run: python3 build.py --offline
      - name: Audit Amazon Associates tags across all published HTML
        working-directory: src/site
        run: python3 audit_affiliate_links.py
      - name: Verify video encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Build product videos and native social review queues
        working-directory: src/site
        run: python3 product_campaigns.py
      - name: Add TikTok Pixel before deployment
        working-directory: src/site
        run: python3 add_tiktok_pixel.py
      - name: Automatically repair supported SEO and affiliate disclosure defects
        working-directory: src/site
        env:
          KFF_SITE_ROOT: public
          KFF_REPAIR_DRY_RUN: "0"
        run: |
          python3 -m py_compile auto_repair.py
          python3 auto_repair.py
          python3 audit_affiliate_links.py
      - name: Push site/public to hostinger-deploy
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          SRC_SHA="$(git -C src rev-parse --short HEAD)"
          if git ls-remote --exit-code --heads "$REPO" hostinger-deploy >/dev/null; then
            git clone -q --depth 1 --branch hostinger-deploy "$REPO" deploy
          else
            git init -q -b hostinger-deploy deploy
            git -C deploy remote add origin "$REPO"
          fi
          printf '%s\\n' "$(git -C src rev-parse HEAD)" > src/site/public/kff-deployment-id.txt
          rsync -a --delete --exclude .git src/site/public/ deploy/
          # pinterest-b0145.html was uploaded to public_html by hand on 2026-11-01, so it is an untracked file on
          # the server and Hostinger's `git pull` refuses to overwrite it (every deploy failed silently). Keep it out
          # of this branch: the server copy (same content) keeps serving, and the p:domain_verify meta tag on every
          # page also verifies the Pinterest claim. Only remove this line after deleting the server copy in hPanel.
          rm -f deploy/pinterest-b0145.html
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No site changes"; exit 0; fi
          git commit -q -m "Deploy site from main@${SRC_SHA}"
          git push origin hostinger-deploy
      - name: Tell Hostinger to pull the new build
        # Hostinger's Git auto-deployment webhook (hPanel > Advanced > GIT > Auto Deployment). Its URL is kept
        # only in the HOSTINGER_DEPLOY_WEBHOOK repository secret, never in this file (the repo is public).
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::HOSTINGER_DEPLOY_WEBHOOK secret is not set; Hostinger was not told to pull."
            exit 1
          fi
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/hostinger-deploy","repository":{"clone_url":"https://github.com/${{ github.repository }}.git"}}' \
            "$HOOK"
      - name: Verify the exact GitHub revision reached the live website
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://kitchenfindsfavorites.com/kff-deployment-id.txt"
          for attempt in $(seq 1 30); do
            ACTUAL="$(curl --silent --show-error --fail --max-time 10 -H 'Cache-Control: no-cache' "${URL}?check=${EXPECTED_SHA}" || true)"
            if [ "${ACTUAL}" = "${EXPECTED_SHA}" ]; then
              echo "Confirmed production deployment revision ${EXPECTED_SHA}"
              curl -fsS -o /dev/null --max-time 15 https://kitchenfindsfavorites.com/
              exit 0
            fi
            echo "Waiting for Hostinger deployment verification (attempt ${attempt}/30)"
            sleep 6
          done
          echo "::error::The expected GitHub revision was not observed on production."
          exit 1
      - name: Tell search engines about the pages (IndexNow)
        # Bing, Yandex and other IndexNow engines recrawl the submitted URLs within hours instead of weeks.
        # The key file /<INDEXNOW_KEY>.txt is written by build.py. A failure here never blocks the deploy.
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 90  # give Hostinger time to pull the new build so the key file and new pages are live
          python3 - <<'EOF'
          import json, re, urllib.request
          site = "src/site"
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', open(f"{site}/build.py").read()).group(1)
          urls = re.findall(r"<loc>([^<]+)</loc>", open(f"{site}/public/sitemap.xml").read())
          body = json.dumps({"host": "kitchenfindsfavorites.com", "key": key,
                             "keyLocation": f"https://kitchenfindsfavorites.com/{key}.txt", "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, "for", len(urls), "URLs")
          EOF
